[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall-weather"
version = "0.1.0"
description = "Inspectable Python companion for Pitwall racetrack weather"
requires-python = ">=3.9"
dependencies = ["python-dotenv>=1.0,<2"]

[project.optional-dependencies]
ui = ["streamlit>=1.50,<2", "pandas>=2.0,<3", "altair>=5,<6"]

[project.scripts]
pitwall-weather = "pitwall_weather.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
